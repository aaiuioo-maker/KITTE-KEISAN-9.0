<style>
:root {
  --dq-bg: #004020;
  --dq-gold: #f0c040;
  --dq-shadow: #001a0a;
  --app-bg: #2a2a2a;
  --app-bg2: #363636;
  --app-bg3: #404040;
  --border: rgba(255,255,255,0.08);
  --border2: rgba(255,255,255,0.20);
  --text: #f0f0f0;
  --text2: #888;
  --text3: #555;
  --accent: #4dcc88;
  --red: #ff6b6b;
  --gold: #f0c040;
  --green: #4cd964;
  --hisoka: #ff5fa8;
  --hisoka2: #b070ff;
  --radius: 14px;
  --radius-sm: 10px;
  /* 文字はすべてこのゴシック体で統一 */
  --font: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Meiryo', sans-serif;
  --font-dq: var(--font);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; max-height: 100dvh; overflow: hidden; background: var(--dq-bg); color: var(--text); font-family: var(--font); overscroll-behavior: none; touch-action: manipulation; }
button { font-family: var(--font); }
svg text { font-family: var(--font); font-weight: 700; }

/* ===== OPENING ===== */
#opening {
  position: fixed; inset: 0; z-index: 1000;
  background: var(--dq-bg);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: env(safe-area-inset-top,44px) 0 env(safe-area-inset-bottom,20px);
  cursor: pointer; user-select: none;
}
.dq-stars { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
.star { position: absolute; width: 2px; height: 2px; background: #a0ffcc; border-radius: 50%; animation: twinkle 2s infinite; }
@keyframes twinkle { 0%,100%{opacity:0.2} 50%{opacity:1} }
/* トランプのマークがふわっと昇っていく */
.suit { position: absolute; bottom: -30px; font-size: 18px; font-weight: 700; opacity: 0; animation: suitRise linear infinite; }
@keyframes suitRise {
  0%   { transform: translateY(0) rotate(0deg); opacity: 0; }
  15%  { opacity: 0.55; }
  85%  { opacity: 0.55; }
  100% { transform: translateY(-110vh) rotate(200deg); opacity: 0; }
}
.dq-logo-wrap { text-align: center; margin-bottom: 18px; animation: fadeInDown 0.8s ease; position: relative; }
@keyframes fadeInDown { from{opacity:0;transform:translateY(-20px)} to{opacity:1;transform:translateY(0)} }
.dq-title { font-family: var(--font-dq); font-size: 24px; font-weight: 900; color: var(--dq-gold); text-shadow: 2px 2px 0 #000; letter-spacing: 2px; line-height: 1.6; }
.dq-subtitle { font-family: var(--font-dq); font-size: 13px; font-weight: 700; color: #a0ffcc; letter-spacing: 1px; }
.dq-scene { width: 280px; height: 120px; margin: 0 auto; animation: fadeIn 1s ease 0.3s both; position: relative; }
@keyframes fadeIn { from{opacity:0} to{opacity:1} }

/* ヒソカのドット絵（元画像の下にあるメッセージ枠は切り取り済み） */
.hisoka-scene {
  width: 310px; margin: 14px auto 0; position: relative; overflow: hidden;
  border: 3px solid var(--dq-gold); border-radius: 4px; background: #000;
  visibility: hidden;
}
/* 1回目のタップでヒソカが登場（効果音を鳴らすにはタップが必要なため） */
#opening.appear .hisoka-scene { visibility: visible; animation: encounter 0.9s steps(1) both; }
#opening.appear .dq-msgbox { visibility: visible; animation: fadeIn 0.3s ease 0.9s both; }
.hisoka-scene img { display: block; width: 100%; height: auto; }
/* 敵があらわれた時のようにチカチカ点滅して登場 */
@keyframes encounter {
  0% { opacity: 0; } 15% { opacity: 1; } 30% { opacity: 0; } 45% { opacity: 1; }
  60% { opacity: 0; } 75%,100% { opacity: 1; }
}
.dq-msgbox { font-family: var(--font-dq); font-size: 13px; font-weight: 700; color: #f8f8f8; background: var(--dq-shadow); border: 3px solid var(--dq-gold); border-radius: 4px; padding: 10px 12px; width: 310px; min-height: 92px; margin: 8px auto 14px; line-height: 1.7; white-space: pre-line; position: relative; visibility: hidden; }
.dq-msgbox .s-p { color: var(--hisoka); }
.dq-msgbox .s-v { color: var(--hisoka2); }
.dq-cursor { display: inline-block; width: 8px; height: 13px; background: #f8f8f8; animation: blink 0.6s step-end infinite; vertical-align: middle; margin-left: 2px; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
.dq-tap-hint { font-family: var(--font-dq); font-size: 12px; font-weight: 700; color: var(--dq-gold); animation: pulse 1.2s ease-in-out infinite; position: relative; }
@keyframes pulse { 0%,100%{opacity:0.4} 50%{opacity:1} }

/* ===== APP ===== */
#app { display: none; max-width: 430px; margin: 0 auto; height: 100dvh; flex-direction: column; background: var(--app-bg); }
#app.visible { display: flex; }

.header { padding: env(safe-area-inset-top,44px) 16px 12px; background: var(--app-bg); position: sticky; top: 0; z-index: 50; border-bottom: 0.5px solid var(--border); }
.header-inner { display: flex; align-items: center; justify-content: space-between; gap: 4px; }
.header-inner h1 { flex: 1; }

/* === Claude Code のキャラクター（ヘッダー左上） === */
.cc-wrap { width: 62px; height: 40px; flex-shrink: 0; display: flex; justify-content: center; }
.cc-mascot { display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; padding-top: 4px; }
.cc-mascot svg { width: 36px; height: 27px; shape-rendering: crispEdges; overflow: visible; transform-origin: center; }
/* 歩く・立ち止まる・手足の動きは、下のスクリプト（ccMascot）で1コマずつ動かしている */
.cc-mascot .cc-label { font-family: -apple-system, "Segoe UI", sans-serif; font-size: 7px; letter-spacing: 0.05em; color: #d97757; opacity: 0.8; white-space: nowrap; }
.cc-body { fill: #d97757; }
.cc-eye { fill: #1a1612; transform-box: fill-box; transform-origin: center; }
/* ときどきまばたき */
.cc-eye { animation: cc-blink 4s infinite; }
@keyframes cc-blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(0.1); } }
.header h1 { font-family: var(--font-dq); font-size: 17px; font-weight: 900; color: var(--dq-gold); letter-spacing: 1px; }
.reset-btn { font-family: var(--font-dq); font-size: 13px; font-weight: 700; color: var(--red); background: none; border: none; cursor: pointer; padding: 6px 10px; }
.reset-btn:active { opacity: 0.5; }

/* 入力固定エリア */
.input-fixed {
  padding: 0 14px;
  background: var(--app-bg);
  flex-shrink: 0;
}

/* 内訳スクロールエリア */
.breakdown-scroll {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 0 14px env(safe-area-inset-bottom,24px);
}

/* 合計ピン表示 */
.total-pin {
  width: 100%;
  background: var(--app-bg2);
  border-top: 1px solid var(--border2);
  border-radius: var(--radius);
  padding: 12px 18px;
  margin-top: 10px;
}
.total-pin-inner { display: flex; align-items: center; gap: 8px; }
.total-pin-left { display: flex; flex-direction: column; gap: 3px; flex: 1; }
.total-pin-right { display: flex; align-items: baseline; gap: 4px; }
.total-pin-label { font-family: var(--font-dq); font-size: 13px; font-weight: 700; color: #bbb; }
.total-pin-value { font-size: 34px; font-weight: 900; color: var(--green); letter-spacing: -1px; transition: transform 0.12s; }
.total-pin-value.pop { animation: pop 0.25s ease; }
@keyframes pop { 0%{transform:scale(1)} 50%{transform:scale(1.16)} 100%{transform:scale(1)} }
.total-pin-unit { font-size: 16px; color: var(--text2); }
.total-pin-count { font-family: var(--font-dq); font-size: 12px; color: #aaa; }

/* セクションラベル */
.section-label {
  font-family: var(--font-dq); font-size: 13px; font-weight: 700;
  color: var(--text2); letter-spacing: 1px;
  margin: 14px 0 7px 2px;
}
.section-label-row {
  display: flex; align-items: center; justify-content: space-between;
  margin: 14px 0 7px 2px;
}
.inline-reset-btn {
  font-family: var(--font-dq); font-size: 12px; font-weight: 700; color: var(--red);
  background: none; border: 1px solid rgba(255,107,107,0.3);
  border-radius: 6px; padding: 4px 10px; cursor: pointer;
}
.inline-reset-btn:active { opacity: 0.5; }

/* 入力カード */
.input-card {
  background: #0d1f3c; border: 1px solid #1e3a5f;
  border-radius: var(--radius); padding: 10px 10px 8px; margin-bottom: 8px;
}
.input-card-title { font-family: var(--font-dq); font-size: 12px; font-weight: 700; color: #6ab0ff; margin-bottom: 7px; }

/* 入力エリア内 */
.input-row { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
.input-row-label { font-size: 15px; color: var(--text); min-width: 36px; }

/* テンキー表示ボタン */
.np-show-btn {
  flex: 1; padding: 7px 10px;
  background: #0a1628; border: 1px solid #1e3a5f;
  border-radius: 10px; font-size: 20px; font-weight: 700; color: var(--text);
  text-align: right; cursor: pointer; user-select: none; min-height: 40px;
}
.np-show-btn.active-den { border-color: var(--gold); color: var(--gold); }
.np-show-btn.active-cnt { border-color: var(--accent); color: var(--accent); }

.input-unit { font-size: 15px; color: var(--text); min-width: 20px; }

/* 追加ボタン */
.add-btn {
  width: 100%; padding: 10px;
  background: var(--accent); border: none; border-radius: 10px;
  font-family: var(--font-dq); font-size: 15px; font-weight: 700; color: #000;
  cursor: pointer; user-select: none; letter-spacing: 1px;
  box-shadow: 0 3px 0 #1a7a44; margin-top: 3px;
}
.add-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #1a7a44; }

/* テンキー（インライン） */
.inline-np {
  display: none; margin-top: 6px;
  background: #0a1628; border-radius: 10px;
  padding: 8px; border: 0.5px solid #1e3a5f;
}
.inline-np.show { display: block; }
.np-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 6px; }
.np-key {
  padding: 14px 0; font-size: 19px; font-weight: 700;
  border-radius: 10px; text-align: center; cursor: pointer; user-select: none;
  background: #0d1f3c; color: var(--text); border: 0.5px solid #1e3a5f;
}
.np-key:active { opacity: 0.45; transform: scale(0.92); }
.np-key.sub { background: #060f1e; color: var(--text2); font-size: 14px; }
.np-key.ok-den { background: var(--gold); color: #000; font-size: 14px; display: flex; align-items: center; justify-content: center; }
.np-key.ok-cnt { background: var(--accent); color: #000; font-size: 14px; display: flex; align-items: center; justify-content: center; }

/* 内訳リスト */
.breakdown-list { display: flex; flex-direction: column; gap: 6px; }
.breakdown-item {
  background: var(--app-bg2); border: 0.5px solid var(--border);
  border-radius: var(--radius-sm); padding: 11px 13px;
  display: flex; align-items: center; gap: 10px;
}
.bd-den {
  font-family: var(--font-dq); font-size: 21px; font-weight: 700; color: var(--gold);
  min-width: 72px;
}
.bd-count { font-size: 20px; color: #f0f0f0; flex: 1; }
.bd-sub { font-size: 20px; font-weight: 700; color: var(--text); min-width: 80px; text-align: right; }
.bd-del {
  width: 30px; height: 30px; background: none;
  border: 0.5px solid var(--border); border-radius: 8px;
  color: var(--red); font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center;
}
.bd-del:active { opacity: 0.5; }

.empty-hint { font-family: var(--font-dq); font-size: 13px; color: var(--text3); text-align: center; padding: 24px 0; }

/* ===== タブ ===== */
.main-tabs {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 0; border-bottom: 0.5px solid var(--border);
}
.main-tab {
  padding: 10px; text-align: center;
  font-family: var(--font-dq); font-size: 14px; font-weight: 700; color: var(--text3);
  cursor: pointer; border-bottom: 2px solid transparent;
  background: none; border-top: none; border-left: none; border-right: none;
}
.main-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
.main-tab:active { opacity: 0.6; }

.tab-pane { display: none; flex: 1; flex-direction: column; overflow: hidden; }
.tab-pane.active { display: flex; }

/* ===== 必要枚数計算 ===== */
.calc-screen {
  flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding: 14px 14px env(safe-area-inset-bottom,20px);
}
.calc-card {
  background: #0d1f3c; border: 1px solid #1e3a5f;
  border-radius: var(--radius); padding: 16px; margin-bottom: 12px;
}
.calc-card-title { font-family: var(--font-dq); font-size: 12px; font-weight: 700; color: #6ab0ff; margin-bottom: 12px; }
.calc-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.calc-row-label { font-size: 15px; color: var(--text); min-width: 60px; }
.calc-np-btn {
  flex: 1; padding: 10px 12px;
  background: #0a1628; border: 1px solid #1e3a5f;
  border-radius: 10px; font-size: 24px; font-weight: 700; color: var(--text);
  text-align: right; cursor: pointer; user-select: none; min-height: 48px;
}
.calc-np-btn.active { border-color: var(--gold); color: var(--gold); }
.calc-unit { font-size: 15px; color: var(--text); min-width: 20px; }
.calc-exec-btn {
  width: 100%; padding: 13px;
  background: var(--accent); border: none; border-radius: 10px;
  font-family: var(--font-dq); font-size: 15px; font-weight: 700; color: #000;
  cursor: pointer; letter-spacing: 1px;
  box-shadow: 0 3px 0 #1a7a44; margin-top: 4px;
}
.calc-exec-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #1a7a44; }

/* 結果カード */
.result-card {
  display: none; background: var(--app-bg2);
  border: 1px solid var(--border2);
  border-radius: var(--radius); padding: 16px; margin-bottom: 8px;
}
.result-card.show { display: block; }
.result-row {
  display: flex; align-items: baseline; gap: 8px;
  padding: 10px 0; border-bottom: 0.5px solid var(--border);
}
.result-row:last-child { border-bottom: none; }
.result-label { font-size: 14px; color: var(--text2); flex: 1; }
.result-value { font-size: 26px; font-weight: 900; color: var(--green); letter-spacing: -0.5px; }
.result-unit { font-size: 14px; color: var(--text2); }
.result-remainder .result-value { color: var(--gold); }
.result-note { font-family: var(--font-dq); font-size: 12px; color: var(--text2); margin-top: 10px; line-height: 1.8; white-space: pre-line; }
</style>
</head>

<script>
/* ===== Web Audio ===== */
function newAC(){ return new (window.AudioContext||window.webkitAudioContext)(); }
function playTick(){
  try{var ac=newAC(),o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.type='square';o.frequency.setValueAtTime(880,ac.currentTime);g.gain.setValueAtTime(0.08,ac.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+0.06);o.start();o.stop(ac.currentTime+0.06);setTimeout(function(){try{ac.close();}catch(e){}},300);}catch(e){}
}
function playConfirm(){
  try{var ac=newAC();[[523,0],[659,0.07],[784,0.14]].forEach(function(n){var o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.type='square';o.frequency.setValueAtTime(n[0],ac.currentTime+n[1]);g.gain.setValueAtTime(0.1,ac.currentTime+n[1]);g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+n[1]+0.12);o.start(ac.currentTime+n[1]);o.stop(ac.currentTime+n[1]+0.12);});setTimeout(function(){try{ac.close();}catch(e){}},800);}catch(e){}
}
function playCancel(){
  try{var ac=newAC(),o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.type='square';o.frequency.setValueAtTime(300,ac.currentTime);o.frequency.exponentialRampToValueAtTime(200,ac.currentTime+0.1);g.gain.setValueAtTime(0.08,ac.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+0.1);o.start();o.stop(ac.currentTime+0.1);setTimeout(function(){try{ac.close();}catch(e){}},500);}catch(e){}
}
function playDelete(){
  try{var ac=newAC(),o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.type='sawtooth';o.frequency.setValueAtTime(400,ac.currentTime);o.frequency.exponentialRampToValueAtTime(150,ac.currentTime+0.15);g.gain.setValueAtTime(0.07,ac.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+0.15);o.start();o.stop(ac.currentTime+0.15);setTimeout(function(){try{ac.close();}catch(e){}},500);}catch(e){}
}
function playAdd(){
  try{var ac=newAC(),now=ac.currentTime;[[659,0,0.10],[784,0.11,0.10],[1047,0.23,0.20]].forEach(function(n){var o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.type='square';o.frequency.setValueAtTime(n[0],now+n[1]);g.gain.setValueAtTime(0.09,now+n[1]);g.gain.exponentialRampToValueAtTime(0.001,now+n[1]+n[2]);o.start(now+n[1]);o.stop(now+n[1]+n[2]+0.02);});setTimeout(function(){try{ac.close();}catch(e){}},800);}catch(e){}
}
function playOpen(){
  try{var ac=newAC(),now=ac.currentTime;var mel=[[330,0.00,0.10],[392,0.10,0.10],[494,0.20,0.10],[523,0.30,0.18],[659,0.50,0.18],[784,0.70,0.22],[988,0.94,0.12],[1047,1.08,0.36],[880,1.46,0.12],[988,1.60,0.12],[1047,1.74,0.50]];mel.forEach(function(n){var o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.type='square';o.frequency.setValueAtTime(n[0],now+n[1]);g.gain.setValueAtTime(0.09,now+n[1]);g.gain.exponentialRampToValueAtTime(0.001,now+n[1]+n[2]);o.start(now+n[1]);o.stop(now+n[1]+n[2]+0.02);});var harm=[[247,0.00,0.10],[294,0.10,0.10],[370,0.20,0.10],[392,0.30,0.18],[523,0.50,0.18],[659,0.70,0.22],[784,0.94,0.12],[880,1.08,0.36],[698,1.46,0.12],[784,1.60,0.12],[880,1.74,0.50]];harm.forEach(function(n){var o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.type='triangle';o.frequency.setValueAtTime(n[0],now+n[1]);g.gain.setValueAtTime(0.05,now+n[1]);g.gain.exponentialRampToValueAtTime(0.001,now+n[1]+n[2]);o.start(now+n[1]);o.stop(now+n[1]+n[2]+0.02);});var bass=[[82,0.00,0.28],[98,0.30,0.18],[110,0.50,0.18],[131,0.70,0.22],[147,0.94,0.50],[131,1.46,0.26],[147,1.74,0.50]];bass.forEach(function(n){var o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.type='sawtooth';o.frequency.setValueAtTime(n[0],now+n[1]);g.gain.setValueAtTime(0.04,now+n[1]);g.gain.exponentialRampToValueAtTime(0.001,now+n[1]+n[2]);o.start(now+n[1]);o.stop(now+n[1]+n[2]+0.02);});setTimeout(function(){try{ac.close();}catch(e){}},3000);}catch(e){}
}

/* ===== OPENING ===== */
var starsEl=document.getElementById('dqStars');
for(var i=0;i<40;i++){var s=document.createElement('div');s.className='star';s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';s.style.animationDelay=(Math.random()*2)+'s';s.style.animationDuration=(1.2+Math.random()*1.5)+'s';starsEl.appendChild(s);}
// トランプのマーク（♠♥♦♣）を下から昇らせる
var suits=['♠','♥','♦','♣'];
for(var j=0;j<12;j++){var su=document.createElement('div');su.className='suit';su.textContent=suits[j%4];su.style.left=(4+Math.random()*92)+'%';su.style.color=(j%2)?'#ff5fa8':'#b070ff';su.style.fontSize=(14+Math.random()*12)+'px';su.style.animationDuration=(7+Math.random()*6)+'s';su.style.animationDelay=(-Math.random()*12)+'s';starsEl.appendChild(su);}

// 奇術師のセリフを1文字ずつ表示（文末のマークは色付き）
var hisokaLines=[
  'ヒソカが あらわれた！',
  'やあ… 切手を数えに来たのかい？♠',
  'キミの計算… 実に美味しそうだ♥'
];
var hisokaFull=hisokaLines.join('\n'), hisokaPos=0, hisokaDone=false;
function paintHisoka(){
  var h='';
  for(var k=0;k<hisokaPos;k++){
    var c=hisokaFull.charAt(k);
    if(c==='♥'||c==='♦') h+='<span class="s-p">'+c+'</span>';
    else if(c==='♠'||c==='♣') h+='<span class="s-v">'+c+'</span>';
    else h+=(c==='<'?'&lt;':c==='>'?'&gt;':c==='&'?'&amp;':c);
  }
  document.getElementById('hisokaMsg').innerHTML=h;
}
function finishHisoka(){
  hisokaPos=hisokaFull.length; paintHisoka(); hisokaDone=true;
  document.getElementById('tapHint').textContent='タップしてすすむ';
}
function typeHisoka(){
  if(openingTapped||hisokaDone) return;
  hisokaPos++; paintHisoka();
  var c=hisokaFull.charAt(hisokaPos-1);
  if(c!==' '&&c!=='\n'&&c!=='…') playBlip();   // 1文字ごとにピピピッ
  if(hisokaPos>=hisokaFull.length){ finishHisoka(); return; }
  setTimeout(typeHisoka, c==='\n'?380 : c==='…'?220 : 70);
}

/* ===== ドラクエ風の効果音（オープニング用・1つの AudioContext を使い回す） ===== */
var openAC=null;
function getOpenAC(){
  if(!openAC){ try{ openAC=newAC(); }catch(e){ return null; } }
  if(openAC.state==='suspended') openAC.resume();
  return openAC;
}
function sq(ac,type,freq,start,dur,vol){
  var o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);
  o.type=type;o.frequency.setValueAtTime(freq,start);
  g.gain.setValueAtTime(vol,start);g.gain.exponentialRampToValueAtTime(0.001,start+dur);
  o.start(start);o.stop(start+dur+0.02);
}
// 敵があらわれた！：上下にかけ回る速いフレーズ → 低い音でドン
function playEncounter(){
  var ac=getOpenAC(); if(!ac) return;
  var now=ac.currentTime+0.02;
  var run=[1319,1175,1047,988,880,784,698,659, 698,784,880,988,1047,1175,1319,1568];
  run.forEach(function(f,i){ sq(ac,'square',f,now+i*0.035,0.05,0.07); });
  var t=now+run.length*0.035+0.02;
  sq(ac,'square',196,t,0.35,0.09); sq(ac,'square',233,t,0.35,0.06); sq(ac,'sawtooth',98,t,0.4,0.06);
}
// セリフを打つ音：短い「ピッ」
function playBlip(){
  var ac=getOpenAC(); if(!ac) return;
  sq(ac,'square',1100,ac.currentTime,0.03,0.045);
}

var openingTapped=false, openingStage=0;
function openingTap(){
  if(openingTapped)return;
  if(openingStage===0){
    // 1回目のタップ：ヒソカがあらわれる
    openingStage=1;
    document.getElementById('opening').classList.add('appear');
    document.getElementById('tapHint').textContent='';
    playEncounter();
    setTimeout(typeHisoka, 1100);
    return;
  }
  // セリフの途中でタップしたら、残りを一気に表示
  if(!hisokaDone){ finishHisoka(); playBlip(); return; }
  openingTapped=true; playOpen();
  var op=document.getElementById('opening');
  op.style.transition='opacity 0.6s ease'; op.style.opacity='0';
  setTimeout(function(){ op.style.display='none'; document.body.style.background='#2a2a2a'; document.getElementById('app').classList.add('visible'); },600);
}

/* ===== STATE ===== */
var stamps = [];
var npStr = { den: '', cnt: '' };
var npOpen = { den: false, cnt: false };
var inputDen = null;
var inputCnt = null;

/* ===== テンキー（インライン） ===== */
function buildGrid(mode){
  var g = document.getElementById('npg-' + mode);
  if(g.children.length > 0) return;
  var okClass = mode === 'den' ? 'ok-den' : 'ok-cnt';
  var h = '';
  ['7','8','9'].forEach(function(d){ h+='<div class="np-key" onclick="ni(\''+mode+'\',\''+d+'\')">'+d+'</div>'; });
  h+='<div class="np-key sub" onclick="nc(\''+mode+'\')">C</div>';
  ['4','5','6'].forEach(function(d){ h+='<div class="np-key" onclick="ni(\''+mode+'\',\''+d+'\')">'+d+'</div>'; });
  h+='<div class="np-key sub" onclick="nd(\''+mode+'\')">⌫</div>';
  ['1','2','3'].forEach(function(d){ h+='<div class="np-key" onclick="ni(\''+mode+'\',\''+d+'\')">'+d+'</div>'; });
  h+='<div class="np-key '+okClass+'" onclick="nok(\''+mode+'\')" style="grid-row:span 2">確定</div>';
  h+='<div class="np-key" onclick="ni(\''+mode+'\',\'0\')" style="grid-column:span 2">0</div>';
  h+='<div class="np-key sub" onclick="closeNp(\''+mode+'\')">✕</div>';
  g.innerHTML = h;
}

function toggleNp(mode){
  playTick();
  var isOpen = npOpen[mode];
  // 両方閉じる
  closeNp('den'); closeNp('cnt');
  if(!isOpen){
    buildGrid(mode);
    npStr[mode] = '';
    refreshBtn(mode);
    document.getElementById('np-' + mode).classList.add('show');
    npOpen[mode] = true;
    // スクロールして見せる
    setTimeout(function(){
      document.getElementById('np-' + mode).scrollIntoView({behavior:'smooth', block:'nearest'});
    }, 60);
  }
}

// 閉じたら打ちかけの数字は捨てて、確定済みの値に戻す
function closeNp(mode){
  document.getElementById('np-' + mode).classList.remove('show');
  npOpen[mode] = false;
  npStr[mode] = '';
  refreshBtn(mode);
}

function ni(mode, d){
  if(npStr[mode].length >= 5) return;
  playTick();
  npStr[mode] += d;
  refreshBtn(mode);
}
function nc(mode){
  playCancel(); npStr[mode] = ''; refreshBtn(mode);
}
function nd(mode){
  playTick(); npStr[mode] = npStr[mode].slice(0,-1); refreshBtn(mode);
}
function nok(mode){
  var v = parseInt(npStr[mode], 10) || 0;
  if(v <= 0){ playCancel(); closeNp(mode); return; }
  playConfirm();
  if(mode === 'den'){
    inputDen = v;
    document.getElementById('btn-den').className = 'np-show-btn active-den';
  } else {
    inputCnt = v;
    document.getElementById('btn-cnt').className = 'np-show-btn active-cnt';
  }
  closeNp(mode);
}

// 入力中はその数字、入力していなければ確定済みの値（なければ —）を表示
function refreshBtn(mode){
  var confirmed = mode === 'den' ? inputDen : inputCnt;
  var v = npStr[mode] ? String(parseInt(npStr[mode], 10)) : (confirmed ? String(confirmed) : '—');
  document.getElementById('btn-' + mode).textContent = v;
}

function clearCountInputs(){
  inputDen = null; inputCnt = null;
  document.getElementById('btn-den').className = 'np-show-btn';
  document.getElementById('btn-cnt').className = 'np-show-btn';
  closeNp('den'); closeNp('cnt');
}

/* ===== 追加 ===== */
function addStamp(){
  if(!inputDen || !inputCnt){ playCancel(); return; }
  playAdd();
  var found = false;
  for(var i=0;i<stamps.length;i++){
    if(stamps[i].den === inputDen){ stamps[i].count += inputCnt; found = true; break; }
  }
  if(!found) stamps.push({den: inputDen, count: inputCnt});
  stamps.sort(function(a,b){ return a.den - b.den; });
  clearCountInputs();
  render();
}

/* ===== 削除 ===== */
function deleteStamp(den){
  playDelete();
  stamps = stamps.filter(function(s){ return s.den !== den; });
  render();
}

/* ===== 描画 ===== */
function render(){
  var list = document.getElementById('breakdown-list');
  if(stamps.length === 0){
    list.innerHTML = '<div class="empty-hint">まだ追加されていません</div>';
    updateTotal(); return;
  }
  var html = '';
  stamps.forEach(function(s){
    var sub = s.den * s.count;
    html += '<div class="breakdown-item">';
    html += '<div class="bd-den">'+s.den+'円</div>';
    html += '<div class="bd-count">× '+s.count+'枚</div>';
    html += '<div class="bd-sub">'+sub.toLocaleString()+'円</div>';
    html += '<button class="bd-del" onclick="deleteStamp('+s.den+')">✕</button>';
    html += '</div>';
  });
  list.innerHTML = html;
  updateTotal();
}

function updateTotal(){
  var total=0, totalCount=0;
  stamps.forEach(function(s){ total+=s.den*s.count; totalCount+=s.count; });
  var valEl=document.getElementById('total-val');
  valEl.textContent=total.toLocaleString();
  valEl.classList.remove('pop'); void valEl.offsetWidth; valEl.classList.add('pop');
  document.getElementById('total-count').textContent=stamps.length+'種類・'+totalCount+'枚';
}

/* ===== タブ切替 ===== */
function switchTab(tab){
  playTick();
  closeNp('den'); closeNp('cnt');
  closeCalcNp('total'); closeCalcNp('den');
  document.getElementById('tab-count').classList.toggle('active', tab==='count');
  document.getElementById('tab-need').classList.toggle('active', tab==='need');
  document.getElementById('pane-count').classList.toggle('active', tab==='count');
  document.getElementById('pane-need').classList.toggle('active', tab==='need');
}

/* ===== 必要枚数計算テンキー ===== */
var calcNpStr = { total:'', den:'' };
var calcNpOpen = { total:false, den:false };
var calcTotal = null, calcDen = null;

function buildCalcGrid(mode){
  var g = document.getElementById('npg-calc-'+mode);
  if(g.children.length > 0) return;
  var h = '';
  ['7','8','9'].forEach(function(d){ h+='<div class="np-key" onclick="cni(\''+mode+'\',\''+d+'\')">'+d+'</div>'; });
  h+='<div class="np-key sub" onclick="cnc(\''+mode+'\')">C</div>';
  ['4','5','6'].forEach(function(d){ h+='<div class="np-key" onclick="cni(\''+mode+'\',\''+d+'\')">'+d+'</div>'; });
  h+='<div class="np-key sub" onclick="cnd(\''+mode+'\')">⌫</div>';
  ['1','2','3'].forEach(function(d){ h+='<div class="np-key" onclick="cni(\''+mode+'\',\''+d+'\')">'+d+'</div>'; });
  h+='<div class="np-key ok-den" onclick="cnok(\''+mode+'\')" style="grid-row:span 2">確定</div>';
  h+='<div class="np-key" onclick="cni(\''+mode+'\',\'0\')" style="grid-column:span 2">0</div>';
  h+='<div class="np-key sub" onclick="closeCalcNp(\''+mode+'\')">✕</div>';
  g.innerHTML = h;
}

function openCalcNp(mode){
  playTick();
  var other = mode==='total' ? 'den' : 'total';
  closeCalcNp(other);
  if(calcNpOpen[mode]){ closeCalcNp(mode); return; }
  buildCalcGrid(mode);
  calcNpStr[mode] = '';
  refreshCalcBtn(mode);
  document.getElementById('np-calc-'+mode).classList.add('show');
  calcNpOpen[mode] = true;
  setTimeout(function(){
    document.getElementById('np-calc-'+mode).scrollIntoView({behavior:'smooth',block:'nearest'});
  },60);
}
// 閉じたら打ちかけの数字は捨てて、確定済みの値に戻す
function closeCalcNp(mode){
  document.getElementById('np-calc-'+mode).classList.remove('show');
  calcNpOpen[mode] = false;
  calcNpStr[mode] = '';
  refreshCalcBtn(mode);
}
function cni(mode,d){
  if(calcNpStr[mode].length>=6) return;
  playTick();
  calcNpStr[mode]+=d;
  refreshCalcBtn(mode);
}
function cnc(mode){ playCancel(); calcNpStr[mode]=''; refreshCalcBtn(mode); }
function cnd(mode){ playTick(); calcNpStr[mode]=calcNpStr[mode].slice(0,-1); refreshCalcBtn(mode); }
function cnok(mode){
  var v = parseInt(calcNpStr[mode], 10)||0;
  if(v<=0){ playCancel(); closeCalcNp(mode); return; }
  playConfirm();
  if(mode==='total') calcTotal=v;
  else calcDen=v;
  document.getElementById('btn-calc-'+mode).className = 'calc-np-btn active';
  // 入力が変わったら古い結果は隠す
  document.getElementById('result-card').classList.remove('show');
  closeCalcNp(mode);
}
function refreshCalcBtn(mode){
  var confirmed = mode==='total' ? calcTotal : calcDen;
  var v = calcNpStr[mode] ? String(parseInt(calcNpStr[mode], 10)) : (confirmed ? String(confirmed) : '—');
  document.getElementById('btn-calc-'+mode).textContent = v;
}

function execCalc(){
  if(!calcTotal || !calcDen){ playCancel(); return; }
  playConfirm();
  var needed = Math.ceil(calcTotal / calcDen);
  var stampTotal = needed * calcDen;
  var remainder = stampTotal - calcTotal;
  document.getElementById('res-count').textContent = needed.toLocaleString();
  document.getElementById('res-remainder').textContent = remainder.toLocaleString();
  document.getElementById('res-stamp-total').textContent = stampTotal.toLocaleString();
  var note = calcDen+'円切手を'+needed+'枚使うと '+stampTotal.toLocaleString()+'円。';
  if(remainder===0){
    note += '\nぴったりです！';
  } else {
    note += '\n目標金額より'+remainder.toLocaleString()+'円多くなります。';
  }
  document.getElementById('result-note').textContent = note;
  document.getElementById('result-card').classList.add('show');
}

/* ===== リセット ===== */
function clearCount(){
  stamps=[];
  clearCountInputs();
  render();
}
function clearCalc(){
  calcTotal=null; calcDen=null;
  document.getElementById('btn-calc-total').className='calc-np-btn';
  document.getElementById('btn-calc-den').className='calc-np-btn';
  closeCalcNp('total'); closeCalcNp('den');
  document.getElementById('result-card').classList.remove('show');
}
function resetCount(){ playCancel(); clearCount(); }
function resetCalc(){ playCancel(); clearCalc(); }
// 右上のリセットは両方のタブをまとめてリセット
function resetAll(){ playCancel(); clearCount(); clearCalc(); }

// =============================================================
// Claude Code のキャラクター（ヘッダー左上）
//   右へ歩く → 端で立ち止まって手足をちょこちょこ動かし、振り向く → 左へ戻る … を繰り返す
// =============================================================
(function ccMascot() {
  const svg = document.querySelector('.cc-mascot svg');
  if (!svg) return;
  const body = svg.querySelector('.cc-hop');
  const armL = svg.querySelector('.cc-arm-l');
  const armR = svg.querySelector('.cc-arm-r');
  const legs = Array.from(svg.querySelectorAll('.cc-leg')); // 左から順に4本

  const HALF = 12;        // 真ん中から左右それぞれに歩く幅（px）
  const STEP = 2;         // 1歩で進む距離（px）
  const TICK = 220;       // 1コマの長さ（ミリ秒）
  const IDLE_TICKS = 9;   // 端で立ち止まるコマ数

  let x = -HALF, dir = 1, mode = 'idle', t = 0;

  const legUp = (i, up) => legs[i].setAttribute('height', up ? 1 : 2);
  const armUp = (el, up) => el.setAttribute('y', up ? 1 : 2);
  const bob = up => body.setAttribute('transform', up ? 'translate(0,-1)' : '');
  const rest = () => { legs.forEach((_, i) => legUp(i, false)); armUp(armL, false); armUp(armR, false); bob(false); };
  const draw = () => { svg.style.transform = `translateX(${x}px) scaleX(${dir})`; };

  function tick() {
    t++;
    if (mode === 'walk') {
      // 歩く：外側2本と内側2本の足を交互に上げ、体も小さく弾ませる
      const ph = t % 2;
      armUp(armL, false); armUp(armR, false);
      legUp(0, ph === 0); legUp(2, ph === 0);
      legUp(1, ph === 1); legUp(3, ph === 1);
      bob(ph === 0);
      x += STEP * dir;
      if (x <= -HALF || x >= HALF) {
        x = Math.max(-HALF, Math.min(HALF, x));
        mode = 'idle'; t = 0; rest();
      }
    } else {
      // 立ち止まり：両腕を交互に上げ下げし、端の足でトントンと足踏み
      const ph = t % 4;
      armUp(armL, ph === 1);
      armUp(armR, ph === 3);
      legUp(0, ph === 2);
      legUp(3, ph === 0);
      bob(false);
      if (t === Math.floor(IDLE_TICKS / 2)) dir = (x >= HALF) ? -1 : 1; // 途中で振り向く
      if (t >= IDLE_TICKS) { mode = 'walk'; t = 0; rest(); }
    }
    draw();
  }

  draw();
  setInterval(tick, TICK);
})();

</script>
